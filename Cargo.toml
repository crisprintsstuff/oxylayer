[workspace]
members = [
    "crates/oxylayer-core",
    "crates/oxylayer-filter",
    "crates/oxylayer-brush",
    "crates/oxylayer-vector",
    "crates/oxylayer-io",
    "crates/oxylayer-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OxyLayer Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
glam = { version = "0.29", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }
kurbo = "0.11"
zstd = "0.13"
bytemuck = { version = "1.18", features = ["derive"] }
thiserror = "1.0"
eframe = "0.37"
